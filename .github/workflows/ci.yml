name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: install
        run: bun install --frozen-lockfile
      - name: test
        run: bun run test
      - name: reject em dash
        run: |
          if git grep -n -I $'\u2014' -- . ':!bun.lock'; then
            exit 1
          fi
