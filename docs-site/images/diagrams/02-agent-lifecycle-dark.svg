<text x="892.0" y="180.0" font-size="14.5" fill="#A4A3B6">Balance stays, owner recovers</text>
<circle cx="1130.0" cy="144.0" r="4.8" fill="#1B1B26" stroke="#F6F5F2" stroke-width="1.8"/>
<rect x="464.0" y="290.0" width="272.0" height="76" rx="12" fill="#1B1B26" stroke="#4A485F" stroke-width="1.2"/>
<text x="480.0" y="322.0" font-size="18" font-weight="650" fill="#F6F5F2">Stopped</text>
<text x="480.0" y="346.0" font-size="14.5" fill="#A4A3B6">Key revoked, not retired</text>
<circle cx="718.0" cy="310.0" r="4.8" fill="#1B1B26" stroke="#F6F5F2" stroke-width="1.8"/>
<circle cx="46.0" cy="410.0" r="5.5" fill="#F6F5F2"/>
<text x="64.0" y="415.0" font-size="14.5" fill="#A4A3B6">Observed on testnet</text>
<circle cx="243.0" cy="410.0" r="4.8" fill="#0A0A10" stroke="#F6F5F2" stroke-width="1.8"/>
<text x="261.0" y="415.0" font-size="14.5" fill="#A4A3B6">Built, off or unrun</text>
<rect x="412.3" y="403.0" width="16" height="14" rx="4" fill="#1B1B26" stroke="#4A485F" stroke-width="1.4" stroke-dasharray="3 2.5"/>
<text x="436.3" y="415.0" font-size="14.5" fill="#A4A3B6">Design only</text>
<path d="M550.1 410.0 L566.1 410.0" stroke="#FF6680" stroke-width="2"/>
<text x="574.1" y="415.0" font-size="14.5" fill="#A4A3B6">Refused or reverts</text>
</svg>