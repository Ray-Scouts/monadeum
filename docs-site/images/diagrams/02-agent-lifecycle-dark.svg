<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 466" width="1200" height="466" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Retiring an agent never moves its capital</title>
<desc id="d">Lifecycle in three states: Created, Active, Retired, with a separate Stopped state. Reading: a funded agent becomes active, a failed evaluation retires it and leaves its balance in place, and an owner stop revokes the session key without retiring.</desc>
<defs>
<marker id="e-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#8483A0"/></marker>
<marker id="s-flow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#8483A0"/></marker>
<marker id="e-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#836EF9"/></marker>
<marker id="s-accent" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#836EF9"/></marker>
<marker id="e-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#3FD69A"/></marker>
<marker id="s-good" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#3FD69A"/></marker>
<marker id="e-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#FF6680"/></marker>
<marker id="s-bad" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#FF6680"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="465" rx="14" fill="#0A0A10" stroke="#2B2A3A"/>
<text x="40" y="58" font-size="24" font-weight="700" fill="#F6F5F2">Retiring an agent never moves its capital</text>
<text x="40" y="88" font-size="16" fill="#A4A3B6">Retirement and the owner stop are separate paths with different effects.</text>
<path d="M324.0 162.0 L464.0 162.0" fill="none" stroke="#8483A0" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#e-flow)"/>
<path d="M736.0 162.0 L876.0 162.0" fill="none" stroke="#FF6680" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#e-bad)"/>
<path d="M600.0 200.0 L600.0 290.0" fill="none" stroke="#FF6680" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#e-bad)"/>
<rect x="360.1" y="149.0" width="67.9" height="26.0" rx="13.0" fill="#0A0A10"/>
<text x="394.0" y="167.0" font-size="14.5" font-weight="500" text-anchor="middle" fill="#A4A3B6">funded</text>
<rect x="758.1" y="149.0" width="95.7" height="26.0" rx="13.0" fill="#0A0A10"/>
<text x="806.0" y="167.0" font-size="14.5" font-weight="500" text-anchor="middle" fill="#FF8CA0">below floor</text>
<rect x="551.7" y="232.0" width="96.6" height="26.0" rx="13.0" fill="#0A0A10"/>
<text x="600.0" y="250.0" font-size="14.5" font-weight="500" text-anchor="middle" fill="#FF8CA0">owner stop</text>
<rect x="52.0" y="124.0" width="272.0" height="76" rx="12" fill="#1B1B26" stroke="#4A485F" stroke-width="1.2"/>
<text x="68.0" y="156.0" font-size="18" font-weight="650" fill="#F6F5F2">Created</text>
<text x="68.0" y="180.0" font-size="14.5" fill="#A4A3B6">Account deployed, principal 0</text>
<circle cx="306.0" cy="144.0" r="5.5" fill="#F6F5F2"/>
<rect x="464.0" y="124.0" width="272.0" height="76" rx="12" fill="#262050" stroke="#836EF9" stroke-width="1.8"/>
<text x="480.0" y="156.0" font-size="18" font-weight="650" fill="#F6F5F2">Active</text>
<text x="480.0" y="180.0" font-size="14.5" fill="#A4A3B6">Ticks once funded</text>
