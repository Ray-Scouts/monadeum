<text x="261.0" y="425.0" font-size="14.5" fill="#5B5968">Built, off or unrun</text>
<rect x="412.3" y="413.0" width="16" height="14" rx="4" fill="#FFFFFF" stroke="#BDBAAE" stroke-width="1.4" stroke-dasharray="3 2.5"/>
