<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 938" width="1200" height="938" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Every layer re-checks what the layer before it claims</title>
<desc id="d">Three bands: untrusted input, the platform, and Monad. The browser and provider responses are re-validated by the platform, the strategy's proposal is checked by the RiskModule, and the chain re-checks the approved plan and rejects any other address.</desc>
