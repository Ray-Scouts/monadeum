<rect x="351.0" y="124.0" width="199.0" height="76" rx="12" fill="#262050" stroke="#836EF9" stroke-width="1.8"/>
<text x="367.0" y="156.0" font-size="18" font-weight="650" fill="#F6F5F2">Hold test</text>
<text x="367.0" y="180.0" font-size="14.5" fill="#A4A3B6">Limit 3 per hour</text>
<circle cx="532.0" cy="144.0" r="4.8" fill="#1B1B26" stroke="#F6F5F2" stroke-width="1.8"/>
<rect x="949.0" y="124.0" width="199.0" height="76" rx="12" fill="#12342A" stroke="#3FD69A" stroke-width="1.5"/>
<text x="965.0" y="156.0" font-size="18" font-weight="650" fill="#F6F5F2">Runs at once</text>
<text x="965.0" y="180.0" font-size="14.5" fill="#A4A3B6">Key destroyed first</text>
<circle cx="1130.0" cy="144.0" r="4.8" fill="#1B1B26" stroke="#F6F5F2" stroke-width="1.8"/>
<rect x="351.0" y="300.0" width="199.0" height="76" rx="12" fill="#3A1A24" stroke="#FF6680" stroke-width="1.5"/>
<text x="367.0" y="332.0" font-size="18" font-weight="650" fill="#F6F5F2">Held</text>
<text x="367.0" y="356.0" font-size="14.5" fill="#A4A3B6">Nothing runs yet</text>
<circle cx="532.0" cy="320.0" r="4.8" fill="#1B1B26" stroke="#F6F5F2" stroke-width="1.8"/>
