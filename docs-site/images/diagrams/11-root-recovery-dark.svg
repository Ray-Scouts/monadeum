<text x="450.5" y="255.0" font-size="14.5" font-weight="500" text-anchor="middle" fill="#FF8CA0">bulk</text>
<rect x="564.3" y="325.0" width="71.3" height="26.0" rx="13.0" fill="#0A0A10"/>
<text x="600.0" y="343.0" font-size="14.5" font-weight="500" text-anchor="middle" fill="#A4A3B6">confirm</text>
