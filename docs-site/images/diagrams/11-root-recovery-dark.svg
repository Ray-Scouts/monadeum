<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 476" width="1200" height="476" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="t">A lone revoke runs at once, a bulk action is held</title>
<desc id="d">Root recovery as a decision. An owner request goes to a hold test. One agent within the limit runs at once. Two or more agents, or more than three in an hour, are held until a second step and a delay, and then execute.</desc>
<defs>
<marker id="e-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#8483A0"/></marker>
<marker id="s-flow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#8483A0"/></marker>
<marker id="e-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#836EF9"/></marker>
<marker id="s-accent" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#836EF9"/></marker>
<marker id="e-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#3FD69A"/></marker>
<marker id="s-good" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#3FD69A"/></marker>
<marker id="e-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#FF6680"/></marker>
<marker id="s-bad" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#FF6680"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="475" rx="14" fill="#0A0A10" stroke="#2B2A3A"/>
<text x="40" y="58" font-size="24" font-weight="700" fill="#F6F5F2">A lone revoke runs at once, a bulk action is held</text>
<text x="40" y="88" font-size="16" fill="#A4A3B6">A stolen root credential must not stop or sweep every agent in one session.</text>
<path d="M251.0 162.0 L351.0 162.0" fill="none" stroke="#8483A0" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#e-flow)"/>
<path d="M550.0 162.0 L949.0 162.0" fill="none" stroke="#3FD69A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#e-good)"/>
<path d="M450.5 200.0 L450.5 300.0" fill="none" stroke="#FF6680" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#e-bad)"/>
<path d="M550.0 338.0 L650.0 338.0" fill="none" stroke="#8483A0" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#e-flow)"/>
<path d="M849.0 338.0 L1038.5 338.0 Q1048.5 338.0 1048.5 328.0 L1048.5 200.0" fill="none" stroke="#8483A0" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#e-flow)"/>
<rect x="271.8" y="149.0" width="58.3" height="26.0" rx="13.0" fill="#0A0A10"/>
<text x="301.0" y="167.0" font-size="14.5" font-weight="500" text-anchor="middle" fill="#A4A3B6">count</text>
