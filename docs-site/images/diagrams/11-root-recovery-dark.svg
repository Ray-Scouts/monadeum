<text x="666.0" y="332.0" font-size="18" font-weight="650" fill="#F6F5F2">Second step</text>
<text x="666.0" y="356.0" font-size="14.5" fill="#A4A3B6">Restate count, wait</text>
<circle cx="831.0" cy="320.0" r="4.8" fill="#1B1B26" stroke="#F6F5F2" stroke-width="1.8"/>
<circle cx="46.0" cy="420.0" r="5.5" fill="#F6F5F2"/>
<text x="64.0" y="425.0" font-size="14.5" fill="#A4A3B6">Observed on testnet</text>
<circle cx="243.0" cy="420.0" r="4.8" fill="#0A0A10" stroke="#F6F5F2" stroke-width="1.8"/>
<text x="261.0" y="425.0" font-size="14.5" fill="#A4A3B6">Built, off or unrun</text>
<rect x="412.3" y="413.0" width="16" height="14" rx="4" fill="#1B1B26" stroke="#4A485F" stroke-width="1.4" stroke-dasharray="3 2.5"/>
<text x="436.3" y="425.0" font-size="14.5" fill="#A4A3B6">Design only</text>
<path d="M550.1 420.0 L566.1 420.0" stroke="#FF6680" stroke-width="2"/>
<text x="574.1" y="425.0" font-size="14.5" fill="#A4A3B6">Refused or reverts</text>
<path d="M734.9 420.0 L750.9 420.0" stroke="#3FD69A" stroke-width="2"/>
<text x="758.9" y="425.0" font-size="14.5" fill="#A4A3B6">Allowed or approved</text>
</svg>