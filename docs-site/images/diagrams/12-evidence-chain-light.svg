<text x="68.0" y="156.0" font-size="18" font-weight="650" fill="#15131F">Pre-registered test</text>
<text x="68.0" y="180.0" font-size="14.5" fill="#5B5968">Rules fixed before any data</text>
<circle cx="532.0" cy="144.0" r="5.5" fill="#15131F"/>
<rect x="52.0" y="260.0" width="498.0" height="76" rx="12" fill="#FFFFFF" stroke="#BDBAAE" stroke-width="1.2"/>
<text x="68.0" y="292.0" font-size="18" font-weight="650" fill="#15131F">Backtest</text>
<text x="68.0" y="316.0" font-size="14.5" fill="#5B5968">1,000 genomes, held-out data</text>
<circle cx="532.0" cy="280.0" r="5.5" fill="#15131F"/>
<rect x="52.0" y="396.0" width="498.0" height="76" rx="12" fill="#FCE8EC" stroke="#D22B4C" stroke-width="1.5"/>
<text x="68.0" y="428.0" font-size="18" font-weight="650" fill="#15131F">Edge not found</text>
<text x="68.0" y="452.0" font-size="14.5" fill="#5B5968">0.028 observed, 0.278 modeled</text>
<circle cx="532.0" cy="416.0" r="5.5" fill="#15131F"/>
<rect x="52.0" y="532.0" width="498.0" height="76" rx="12" fill="#FFFFFF" stroke="#BDBAAE" stroke-width="1.2"/>
<text x="68.0" y="564.0" font-size="18" font-weight="650" fill="#15131F">No-go recorded</text>
