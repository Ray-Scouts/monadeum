<text x="301.0" y="507.0" font-size="14.5" font-weight="500" text-anchor="middle" fill="#5B5968">recorded</text>
<rect x="249.7" y="625.0" width="102.7" height="26.0" rx="13.0" fill="#FBFAF9"/>
<text x="301.0" y="643.0" font-size="14.5" font-weight="500" text-anchor="middle" fill="#5238E0">switched off</text>
