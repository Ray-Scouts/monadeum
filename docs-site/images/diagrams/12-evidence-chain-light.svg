<path d="M301.0 608.0 L301.0 668.0" fill="none" stroke="#6A50F2" stroke-width="2" stroke-linejoin="round" marker-end="url(#e-accent)"/>
<path d="M550.0 434.0 L949.0 434.0" fill="none" stroke="#77758A" stroke-width="1.6" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#e-flow)"/>
<path d="M949.0 706.0 L550.0 706.0" fill="none" stroke="#77758A" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#e-flow)"/>
