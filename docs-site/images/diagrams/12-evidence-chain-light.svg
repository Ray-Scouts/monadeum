<text x="68.0" y="700.0" font-size="18" font-weight="650" fill="#15131F">Reallocation off</text>
<text x="68.0" y="724.0" font-size="14.5" fill="#5B5968">Unset means false</text>
<circle cx="532.0" cy="688.0" r="4.8" fill="#FFFFFF" stroke="#15131F" stroke-width="1.8"/>
<rect x="949.0" y="396.0" width="199.0" height="76" rx="12" fill="#FFFFFF" stroke="#BDBAAE" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="965.0" y="428.0" font-size="18" font-weight="650" fill="#15131F">Study scope</text>
<text x="965.0" y="452.0" font-size="14.5" fill="#5B5968">One strategy plugin</text>
<rect x="949.0" y="668.0" width="199.0" height="76" rx="12" fill="#FFFFFF" stroke="#BDBAAE" stroke-width="1.2"/>
<text x="965.0" y="700.0" font-size="18" font-weight="650" fill="#15131F">Production gate</text>
<text x="965.0" y="724.0" font-size="14.5" fill="#5B5968">Needs a new study</text>
<circle cx="1130.0" cy="688.0" r="4.8" fill="#FFFFFF" stroke="#15131F" stroke-width="1.8"/>
<circle cx="46.0" cy="788.0" r="5.5" fill="#15131F"/>
<text x="64.0" y="793.0" font-size="14.5" fill="#5B5968">Run and reported</text>
<circle cx="223.9" cy="788.0" r="4.8" fill="#FBFAF9" stroke="#15131F" stroke-width="1.8"/>
<text x="241.9" y="793.0" font-size="14.5" fill="#5B5968">Built, off by default</text>
<rect x="402.7" y="781.0" width="16" height="14" rx="4" fill="#FFFFFF" stroke="#BDBAAE" stroke-width="1.4" stroke-dasharray="3 2.5"/>
<text x="426.7" y="793.0" font-size="14.5" fill="#5B5968">Not shown by the study</text>
</svg>