<text x="749.5" y="711.0" font-size="14.5" font-weight="500" text-anchor="middle" fill="#A4A3B6">unlocks</text>
<rect x="52.0" y="124.0" width="498.0" height="76" rx="12" fill="#1B1B26" stroke="#4A485F" stroke-width="1.2"/>
<text x="68.0" y="156.0" font-size="18" font-weight="650" fill="#F6F5F2">Pre-registered test</text>
<text x="68.0" y="180.0" font-size="14.5" fill="#A4A3B6">Rules fixed before any data</text>
<circle cx="532.0" cy="144.0" r="5.5" fill="#F6F5F2"/>
<rect x="52.0" y="260.0" width="498.0" height="76" rx="12" fill="#1B1B26" stroke="#4A485F" stroke-width="1.2"/>
<text x="68.0" y="292.0" font-size="18" font-weight="650" fill="#F6F5F2">Backtest</text>
<text x="68.0" y="316.0" font-size="14.5" fill="#A4A3B6">1,000 genomes, held-out data</text>
<circle cx="532.0" cy="280.0" r="5.5" fill="#F6F5F2"/>
<rect x="52.0" y="396.0" width="498.0" height="76" rx="12" fill="#3A1A24" stroke="#FF6680" stroke-width="1.5"/>
<text x="68.0" y="428.0" font-size="18" font-weight="650" fill="#F6F5F2">Edge not found</text>
<text x="68.0" y="452.0" font-size="14.5" fill="#A4A3B6">0.028 observed, 0.278 modeled</text>
<circle cx="532.0" cy="416.0" r="5.5" fill="#F6F5F2"/>
<rect x="52.0" y="532.0" width="498.0" height="76" rx="12" fill="#1B1B26" stroke="#4A485F" stroke-width="1.2"/>
<text x="68.0" y="564.0" font-size="18" font-weight="650" fill="#F6F5F2">No-go recorded</text>
<text x="68.0" y="588.0" font-size="14.5" fill="#A4A3B6">In EVOLUTION.md section 7</text>
<circle cx="532.0" cy="552.0" r="5.5" fill="#F6F5F2"/>
<rect x="52.0" y="668.0" width="498.0" height="76" rx="12" fill="#262050" stroke="#836EF9" stroke-width="1.8"/>
<text x="68.0" y="700.0" font-size="18" font-weight="650" fill="#F6F5F2">Reallocation off</text>
<text x="68.0" y="724.0" font-size="14.5" fill="#A4A3B6">Unset means false</text>
<circle cx="532.0" cy="688.0" r="4.8" fill="#1B1B26" stroke="#F6F5F2" stroke-width="1.8"/>
<rect x="949.0" y="396.0" width="199.0" height="76" rx="12" fill="#1B1B26" stroke="#4A485F" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="965.0" y="428.0" font-size="18" font-weight="650" fill="#F6F5F2">Study scope</text>
<text x="965.0" y="452.0" font-size="14.5" fill="#A4A3B6">One strategy plugin</text>
<rect x="949.0" y="668.0" width="199.0" height="76" rx="12" fill="#1B1B26" stroke="#4A485F" stroke-width="1.2"/>
<text x="965.0" y="700.0" font-size="18" font-weight="650" fill="#F6F5F2">Production gate</text>
<text x="965.0" y="724.0" font-size="14.5" fill="#A4A3B6">Needs a new study</text>
<circle cx="1130.0" cy="688.0" r="4.8" fill="#1B1B26" stroke="#F6F5F2" stroke-width="1.8"/>
<circle cx="46.0" cy="788.0" r="5.5" fill="#F6F5F2"/>
<text x="64.0" y="793.0" font-size="14.5" fill="#A4A3B6">Run and reported</text>
<circle cx="223.9" cy="788.0" r="4.8" fill="#0A0A10" stroke="#F6F5F2" stroke-width="1.8"/>
<text x="241.9" y="793.0" font-size="14.5" fill="#A4A3B6">Built, off by default</text>
<rect x="402.7" y="781.0" width="16" height="14" rx="4" fill="#1B1B26" stroke="#4A485F" stroke-width="1.4" stroke-dasharray="3 2.5"/>
<text x="426.7" y="793.0" font-size="14.5" fill="#A4A3B6">Not shown by the study</text>
</svg>