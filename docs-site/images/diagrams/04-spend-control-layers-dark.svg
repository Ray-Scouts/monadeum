<text x="965.0" y="232.0" font-size="14.5" fill="#A4A3B6">Halts every tick</text>
<circle cx="1130.0" cy="196.0" r="4.8" fill="#1B1B26" stroke="#F6F5F2" stroke-width="1.8"/>
<rect x="52.0" y="312.0" width="498.0" height="76" rx="12" fill="#262050" stroke="#836EF9" stroke-width="1.8"/>
<text x="68.0" y="344.0" font-size="18" font-weight="650" fill="#F6F5F2">RiskModule</text>
