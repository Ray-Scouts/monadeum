<text x="749.5" y="543.0" font-size="14.5" font-weight="500" text-anchor="middle" fill="#FF8CA0">any violation</text>
<rect x="691.2" y="661.0" width="116.6" height="26.0" rx="13.0" fill="#13131B"/>
<text x="749.5" y="679.0" font-size="14.5" font-weight="500" text-anchor="middle" fill="#FF8CA0">over daily cap</text>
