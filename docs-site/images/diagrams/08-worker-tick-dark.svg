<marker id="e-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#FF6680"/></marker>
<marker id="s-bad" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#FF6680"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="1115" rx="14" fill="#0A0A10" stroke="#2B2A3A"/>
<text x="40" y="58" font-size="24" font-weight="700" fill="#F6F5F2">A tick either submits an approved plan or stops without acting</text>
<text x="40" y="88" font-size="16" fill="#A4A3B6">Any failure ends the tick with no action, and that outcome is final for the tick key.</text>
