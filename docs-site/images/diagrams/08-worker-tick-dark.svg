<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1116" width="1200" height="1116" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="t">A tick either submits an approved plan or stops without acting</title>
<desc id="d">One worker tick as a vertical path: claim the tick, check the gates, observe, propose, check risk, submit, and measure. Four steps can fail, and each failure leads to a single no-action outcome that is final for that tick.</desc>
<defs>
