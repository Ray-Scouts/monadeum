<text x="68.0" y="776.0" font-size="14.5" fill="#A4A3B6">Match settlement, alert</text>
<circle cx="532.0" cy="740.0" r="4.8" fill="#1B1B26" stroke="#F6F5F2" stroke-width="1.8"/>
