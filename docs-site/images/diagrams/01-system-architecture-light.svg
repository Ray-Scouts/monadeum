<title id="t">Services propose, the chain decides</title>
<desc id="d">System map in three bands: owner and browser, off-chain services, on-chain contracts. Reading: the tick runner sends an approved plan through ZeroDev to the agent account, where the spend policy contract checks it on chain.</desc>
