<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1108" width="1200" height="1108" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Reallocation is off by default, and retirement moves nothing</title>
<desc id="d">One evaluation as a vertical path. Evaluation always runs retirement, which leaves capital in place. A switch, off by default, gates planning, the RiskModule, the on-chain contract checks, and the move.</desc>
<defs>
<marker id="e-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#77758A"/></marker>
<marker id="s-flow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#77758A"/></marker>
<marker id="e-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#6A50F2"/></marker>
<marker id="s-accent" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#6A50F2"/></marker>
<marker id="e-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#0E9A62"/></marker>
<marker id="s-good" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#0E9A62"/></marker>
<marker id="e-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L10 5 L1 9 Z" fill="#D22B4C"/></marker>
<marker id="s-bad" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M9 1 L0 5 L9 9 Z" fill="#D22B4C"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="1107" rx="14" fill="#FBFAF9" stroke="#E1DFD8"/>
<text x="40" y="58" font-size="24" font-weight="700" fill="#15131F">Reallocation is off by default, and retirement moves nothing</text>
<text x="40" y="88" font-size="16" fill="#5B5968">Fitness and retirement always run. Moves run only when the switch is on.</text>
